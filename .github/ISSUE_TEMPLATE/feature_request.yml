name: Feature request
description: Suggest an improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The Companion's contract is deliberately narrow: from your own paired devices you can approve, deny or send a preset reply to a request that is pending right now. There is no free text, no terminal output and no file transfer, and the relay only ever carries ciphertext. Requests that widen that (free text, running commands, reading output or files, anything that lets a server read content) will be declined; improvements inside it are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: security
    attributes:
      label: What would it read, send or let a remote device do?
      description: If it touches data on your computer or lets a device do something new, say what and what stops it going wrong.
