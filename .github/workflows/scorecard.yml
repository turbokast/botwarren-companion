name: OpenSSF Scorecard

# Scores this repository against the OpenSSF Scorecard checks (branch protection, pinned dependencies, token permissions, signed
# releases, dependency updates, security policy, and more), uploads the results to code scanning and publishes them to the OpenSSF
# API, which is what the Scorecard badge in the README reads.
#
# Constraints of publish_results (see the action's README): only the official action, no top-level `env` or `defaults`, and the job
# permissions below are the whole set it may have. It checks out and reads; it never runs repository code.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 3 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish the results to the OpenSSF API (OIDC, no stored credential)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF file for 5 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
