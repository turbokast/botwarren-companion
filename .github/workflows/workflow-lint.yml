name: Workflow lint

# Lints the GitHub Actions workflows themselves when they change (and weekly, because new rules appear):
#   actionlint  syntax, expression and shell errors (it runs shellcheck over every `run:` script)
#   zizmor      security: template injection, over-broad permissions, unpinned actions, credential persistence, cache poisoning, ...
# Neither needs a credential beyond the read-only token. The workflows are also scanned by CodeQL (language `actions`).
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release tarball is verified against a SHA-256 pinned here (the value is also in the project's published
      # actionlint_1.7.12_checksums.txt), so a changed download fails the job instead of running.
      - name: Install actionlint 1.7.12 (checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}/actionlint" actionlint

      - name: actionlint
        run: '"${RUNNER_TEMP}/actionlint/actionlint" -color'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings fail the job and are printed in the log. (advanced-security: true would also upload SARIF to code scanning, which
      # needs security-events: write and is not available to pull requests from forks.)
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
