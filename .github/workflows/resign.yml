name: Re-sign component manifest

# Renews the CURRENT signed component manifest before it expires. A component manifest is valid for 90 days (the ship agent and the manual installer install
# nothing from an expired one, and never stop a running companion). A release makes a new one; this workflow covers a quiet quarter. It publishes NO new
# software: the same version, the same bundle bytes (re-checked against the published SHA-256), a manifest counter one higher and a fresh 90 days.
#
#   plan      no secrets, read-only token: fetches the published manifest, verifies it against the PINNED component keys and says how many days are left.
#             It only goes on if fewer than 45 days remain (or a maintainer runs the workflow by hand with "force"). Monthly runs therefore renew about
#             every second or third month, and never leave less than a month of margin.
#   resign    PROTECTED `release` environment (required reviewer: the same approval a release needs). Prepares the new manifest from the verified published
#             one (scripts/resign-component-manifest.mjs prepare), signs it with Cloud KMS through GitHub OIDC workload identity federation (the same key
#             and service account as a release: no key file, no stored credential) and checks the result against the published manifest.
#   publish   PROTECTED `release` environment (a second approval): re-checks the result, then uploads manifest.json.sig and manifest.json to R2.
#
# Google only lets this exact repository, workflow file, ref and environment use the key: the provider condition lists `release.yml` at a `v*` tag AND `resign.yml`
# at `refs/heads/main` (docs/RELEASING.md, "Scheduled re-sign"). The `release` environment must allow the `main` branch as well as `v*` tags (docs/REPO_SETTINGS.md).
# Nothing runs without a maintainer's approval; a run nobody approves just waits and expires.
#
# Every action is pinned to a full commit SHA (the tag is in the trailing comment). Update them through Dependabot.
#
# Repository variables (the same as the release workflow): RELEASE_SIGNING (must be `kms`), GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, RELEASE_EPOCH (optional).
# Secrets, only in the `release` environment: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT.

on:
  schedule:
    - cron: '17 6 1 * *'   # monthly, 06:17 UTC on the 1st
  workflow_dispatch:
    inputs:
      force:
        description: Renew now, even if more than 45 days remain
        type: boolean
        default: false

permissions: {}

concurrency:
  group: resign-component-manifest
  cancel-in-progress: false

env:
  R2_BUCKET: botwarren-downloads
  NODE_VERSION: '24'
  DOWNLOADS_URL: https://downloads.botwarren.com
  KMS_KEY_VERSION: projects/botwarren-release/locations/europe-west2/keyRings/botwarren-release/cryptoKeys/component-signing/cryptoKeyVersions/1
  KMS_KEY_ID: kms-comp-2026a

jobs:
  plan:
    name: is a renewal due
    if: github.repository == 'turbokast/botwarren-companion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false   # release jobs never use a build cache (cache poisoning)

      - name: Install the production dependencies only; no install scripts run
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Fetch the published component manifest
        run: |
          set -euo pipefail
          mkdir -p published
          code=$(curl -sS -o published/manifest.json -w '%{http_code}' "${DOWNLOADS_URL}/companion/manifest.json" || true)
          if [ "${code}" = "404" ]; then
            rm -f published/manifest.json
            echo "::notice::no component manifest has been published yet: nothing to renew"
          elif [ "${code}" = "200" ]; then
            curl -fsS -o published/manifest.json.sig "${DOWNLOADS_URL}/companion/manifest.json.sig"
          else
            echo "::error::could not fetch the published component manifest (HTTP ${code})"; exit 1
          fi

      - name: Verify it against the pinned keys and decide
        id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          if [ ! -f published/manifest.json ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          args=(plan --manifest published/manifest.json --sig published/manifest.json.sig --within-days 45 --github-output)
          if [ "${FORCE}" = "true" ]; then args+=(--force); fi
          node --disable-warning=ExperimentalWarning apps/companion/scripts/resign-component-manifest.mjs "${args[@]}" | tee plan.txt
          { echo '### Component manifest'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  resign:
    name: re-sign with Cloud KMS
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The protected environment. Its name is part of the OIDC token, and Google's attribute condition requires exactly `release`.
    environment:
      name: release
    permissions:
      contents: read
      id-token: write        # the OIDC token that Google exchanges for a short-lived credential: this job is the only one with it
    steps:
      - name: Require signed mode
        env:
          RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING }}
        run: |
          [ "${RELEASE_SIGNING}" = "kms" ] || { echo "::error::the repository variable RELEASE_SIGNING must be 'kms' (docs/RELEASING.md)"; exit 1; }

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false   # release jobs never use a build cache (cache poisoning)

      - name: Install the production dependencies only; no install scripts run
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      # The published manifest and the bundle it names are fetched again here (not passed from the plan job): this job trusts nothing but the pinned keys and
      # the hash in the verified manifest.
      - name: Fetch the published manifest and the bundle it describes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          case "${VERSION}" in *[!0-9.]*|'') echo "::error::unexpected version from the plan job"; exit 1 ;; esac
          mkdir -p published
          curl -fsS -o published/manifest.json "${DOWNLOADS_URL}/companion/manifest.json"
          curl -fsS -o published/manifest.json.sig "${DOWNLOADS_URL}/companion/manifest.json.sig"
          curl -fsS -o "published/companion-${VERSION}.zip" "${DOWNLOADS_URL}/companion/companion-${VERSION}.zip"
          for f in published/manifest.json published/manifest.json.sig "published/companion-${VERSION}.zip"; do
            test -s "${f}" || { echo "::error::missing ${f}"; exit 1; }
          done

      - name: Prepare the renewed manifest (verifies the published manifest and the bundle first; changes only the counter and the dates)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_EPOCH: ${{ vars.RELEASE_EPOCH }}
        run: |
          set -euo pipefail
          args=(prepare --manifest published/manifest.json --sig published/manifest.json.sig --zip "published/companion-${VERSION}.zip" --out resigned)
          if [ -n "${RELEASE_EPOCH:-}" ]; then args+=(--epoch "${RELEASE_EPOCH}"); fi
          node --disable-warning=ExperimentalWarning apps/companion/scripts/resign-component-manifest.mjs "${args[@]}"

      - name: Authenticate to Google Cloud (workload identity federation, no key file)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s

      - name: Sign the component manifest with Cloud KMS (domain botwarren-component-v1; verified against the pinned public key before it is written)
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node --disable-warning=ExperimentalWarning apps/companion/vendor/agent/scripts/component-sign.mjs --kms "${KMS_KEY_VERSION}" --key-id "${KMS_KEY_ID}" resigned/manifest.json

      - name: Check the signed result against the published manifest
        env:
          RELEASE_EPOCH: ${{ vars.RELEASE_EPOCH }}
        run: |
          set -euo pipefail
          args=(check --previous published/manifest.json --previous-sig published/manifest.json.sig --manifest resigned/manifest.json --sig resigned/manifest.json.sig)
          if [ -n "${RELEASE_EPOCH:-}" ]; then args+=(--epoch "${RELEASE_EPOCH}"); fi
          node --disable-warning=ExperimentalWarning apps/companion/scripts/resign-component-manifest.mjs "${args[@]}"
          { echo '### Renewed component manifest'; echo '```'; cat resigned/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the renewed manifest and the one it replaces for the next job
        run: |
          set -euo pipefail
          mkdir -p handoff/previous handoff/resigned
          cp published/manifest.json published/manifest.json.sig handoff/previous/
          cp resigned/manifest.json resigned/manifest.json.sig handoff/resigned/

      - name: Upload the handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resigned-manifest
          path: handoff/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: upload the renewed manifest
    needs: [plan, resign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The protected environment (a second approval). Holds R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT. This job has no id-token and cannot sign.
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false   # release jobs never use a build cache (cache poisoning)

      - name: Install the production dependencies only; no install scripts run
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Download the handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resigned-manifest
          path: handoff

      - name: Check that everything this job uses is present, and check the renewed manifest again against the pinned keys
        env:
          RELEASE_EPOCH: ${{ vars.RELEASE_EPOCH }}
        run: |
          set -euo pipefail
          for f in handoff/previous/manifest.json handoff/previous/manifest.json.sig handoff/resigned/manifest.json handoff/resigned/manifest.json.sig; do
            test -s "${f}" || { echo "::error::missing ${f}: an artifact was not downloaded"; exit 1; }
          done
          args=(check --previous handoff/previous/manifest.json --previous-sig handoff/previous/manifest.json.sig --manifest handoff/resigned/manifest.json --sig handoff/resigned/manifest.json.sig)
          if [ -n "${RELEASE_EPOCH:-}" ]; then args+=(--epoch "${RELEASE_EPOCH}"); fi
          node --disable-warning=ExperimentalWarning apps/companion/scripts/resign-component-manifest.mjs "${args[@]}"

      # Nothing may have been published in between (a release while this run waited for approval would have a higher counter): refuse to go backwards.
      - name: Check that the published manifest is still the one that was renewed
        run: |
          set -euo pipefail
          curl -fsS -o now.json "${DOWNLOADS_URL}/companion/manifest.json"
          cmp now.json handoff/previous/manifest.json || { echo "::error::the published component manifest changed while this run waited (a release?); run this workflow again"; exit 1; }

      - name: Upload to Cloudflare R2 (the signature first, then the manifest, which is what makes it current)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not set in the release environment}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not set in the release environment}"
          : "${R2_ENDPOINT:?R2_ENDPOINT is not set in the release environment}"
          put() { aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "${R2_ENDPOINT}" --cache-control "public, max-age=300" --only-show-errors; }
          put handoff/resigned/manifest.json.sig companion/manifest.json.sig
          put handoff/resigned/manifest.json companion/manifest.json
          echo "uploaded the renewed component manifest to ${R2_BUCKET}/companion/"

      - name: Read it back from the public address and check it again
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p live
          curl -fsS -H 'cache-control: no-cache' -o live/manifest.json "${DOWNLOADS_URL}/companion/manifest.json?r=${GITHUB_RUN_ID}"
          curl -fsS -H 'cache-control: no-cache' -o live/manifest.json.sig "${DOWNLOADS_URL}/companion/manifest.json.sig?r=${GITHUB_RUN_ID}"
          cmp live/manifest.json handoff/resigned/manifest.json
          cmp live/manifest.json.sig handoff/resigned/manifest.json.sig
          node --disable-warning=ExperimentalWarning apps/companion/scripts/resign-component-manifest.mjs plan --manifest live/manifest.json --sig live/manifest.json.sig | tee live.txt
          { echo '### Published'; echo '```'; cat live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
