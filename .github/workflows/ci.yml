name: CI

# Typecheck and tests on Linux, macOS and Windows, the web client in a real browser, and a reproducible-build check of what a release would publish.
# Runs on pushes to main and on every pull request, INCLUDING pull requests from forks. It uses the `pull_request` event (never
# `pull_request_target`), requests read-only permissions and uses no secret at all, so code from a fork never sees a credential.
#
# The job names below are the required status checks of the `protect-main` ruleset (docs/REPO_SETTINGS.md). Renaming a job means
# updating the ruleset.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Protocol test vectors (RFC 9180, RFC 8032, RFC 5869), tamper and replay tests, the relay, an end-to-end run with a simulated phone, and the
      # release tooling (build, manifest assembly, signing and verification with a throw-away key).
      - name: Test
        run: pnpm test

  web-client:
    name: web client in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @botwarren/companion exec playwright install --with-deps chromium

      # Builds the client, signs it with a throw-away key, starts a real relay and a simulated computer, and pairs and approves through the page.
      - name: End-to-end test of the signed web client
        run: pnpm test:e2e

  reproducible-build:
    name: reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release workflow builds the client and the component twice and refuses to publish unless the hashes are identical; this is the same
      # check on every change, so a change that breaks reproducibility is caught in review and not at release time.
      - name: Build twice and compare
        env:
          SOURCE_DATE_EPOCH: '1793534400'
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for n in a b; do
            node --disable-warning=ExperimentalWarning apps/companion/client/scripts/build.mjs --out "dist/${n}/client"
            node --disable-warning=ExperimentalWarning apps/companion/scripts/build-component.mjs --out "dist/${n}/component"
            (cd "dist/${n}" && find . -type f | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS."${n}")
          done
          diff -u dist/SHA256SUMS.a dist/SHA256SUMS.b
          { echo '### Reproducible build'; echo '```'; cat dist/SHA256SUMS.a; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
